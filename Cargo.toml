[package]
name = "angren-flag-quiz"
version = "2.0.0"
edition = "2021"

[lib]
name = "angren_quiz_core"
path = "src/lib.rs"

[[bin]]
name = "start"
path = "api/start.rs"

[[bin]]
name = "submit"
path = "api/submit.rs"

[[bin]]
name = "leaderboard"
path = "api/leaderboard.rs"

[dependencies]
vercel_runtime = "1.1"
tokio = { version = "1.39", features = ["macros", "rt-multi-thread"] }
mongodb = "3.1.0"
bson = { version = "2.11", features = ["chrono-0_4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.19"
