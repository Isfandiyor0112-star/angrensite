[package]
name = "angren-flag-quiz"
version = "2.0.0"
edition = "2021"

[dependencies]
vercel_runtime = "1.1"
tokio = { version = "1.39", features = ["macros", "rt-multi-thread"] }
mongodb = "3.1.0"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
